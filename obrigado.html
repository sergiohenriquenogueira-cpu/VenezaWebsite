<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">

  <style>
    :root {
      --color-01: #050507;
      --color-02: #FF8D28;
      --color-04: #909090;
      --font-display: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --font-primary: 'Inter', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      font-family: var(--font-primary);
      color: var(--color-01);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .back-link {
      position: absolute;
      top: 32px;
      left: 40px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-04);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--color-01);
    }

    .center {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 96px;
      font-weight: 600;
      color: var(--color-01);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .message {
      font-size: 16px;
      color: var(--color-04);
      line-height: 1.5;
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      .back-link {
        top: 28px;
        left: 24px;
        font-size: 15px;
        gap: 8px;
      }

      .center {
        justify-content: flex-start;
        padding-top: calc(28px + 20px + 60px);
      }

      h1 {
        font-size: 56px;
        margin-bottom: 16px;
      }

      .message {
        font-size: 16px;
        max-width: 320px;
      }
    }

    @media (max-width: 375px) {
      h1 {
        font-size: 46px;
      }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">← Voltar ao início</a>

  <div class="center">
    <h1>Obrigado</h1>
    <p class="message">Sua mensagem foi enviada com sucesso.</p>
  </div>

</body>
</html>
